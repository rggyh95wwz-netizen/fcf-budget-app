<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCF Budget & Löhne</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--line:#e1e4e9;--text:#1c2230;--muted:#667085;
  --accent:#c8102e;--accent2:#8f0b20;--accentSoft:#fbe9ec;--ok:#1f8a4c;--okSoft:#e6f4ec;--warn:#b26a00;--warnSoft:#fff4e0;
  --bar1:#c8102e;--bar2:#c8102e;--bar3:#9aa4b5;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#12151b;--panel:#1a1e26;--panel2:#222733;--line:#2e3442;--text:#e6e9ef;--muted:#9aa3b2;
  --accent:#ef4058;--accent2:#ff6b80;--accentSoft:#3a1c22;--ok:#4cc280;--okSoft:#17301f;--warn:#e0a040;--warnSoft:#33280f;
  --bar1:#ef4058;--bar2:#ef4058;--bar3:#5b6475;--shadow:none}}
:root[data-theme=dark]{
  --bg:#12151b;--panel:#1a1e26;--panel2:#222733;--line:#2e3442;--text:#e6e9ef;--muted:#9aa3b2;
  --accent:#ef4058;--accent2:#ff6b80;--accentSoft:#3a1c22;--ok:#4cc280;--okSoft:#17301f;--warn:#e0a040;--warnSoft:#33280f;
  --bar1:#ef4058;--bar2:#ef4058;--bar3:#5b6475;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
nav .logo{width:34px;height:40px;object-fit:contain;flex:none}
.loginlogo{display:block;width:96px;height:auto;margin:0 auto 14px}
nav .brand b{display:block;font-size:15px}nav .brand small{color:var(--muted)}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 6px}
nav a{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--panel2)}nav a.on{background:var(--accentSoft);color:var(--accent);font-weight:600}
nav .save{margin-top:18px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted)}
nav .save .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
nav .save .dot.dirty{background:var(--warn)}
main{padding:20px 28px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:22px;margin:0}
.top .sel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input[type=number]{text-align:right}
::placeholder{color:var(--muted);opacity:.7}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{width:100%;min-height:60px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{background:var(--accent2)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel2);font-size:12px;font-weight:600;color:var(--muted);z-index:1;cursor:pointer;user-select:none}
th.ns{cursor:default}
td.n,th.n{text-align:right}
tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
tfoot td{font-weight:700;background:var(--panel2);position:sticky;bottom:0}
td input[type=number]{width:80px;padding:3px 6px}
td input[type=text]{width:150px;padding:3px 6px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.ein{background:#e8efff;color:#2b55b8;border-color:#cdd9fb}.tag.pau{background:var(--okSoft);color:var(--ok);border-color:transparent}.tag.eins{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.tag.red{background:var(--accentSoft);color:var(--accent);border-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.ein{background:#1d2a48;color:#9bb7f5;border-color:transparent}}
.muted{color:var(--muted)}.pos{color:var(--ok)}.neg{color:var(--accent)}
.bars .row{display:grid;grid-template-columns:190px 1fr 110px;gap:10px;align-items:center;padding:4px 0}
.bars .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{position:relative;height:18px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bars .b{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bars .b.b1{background:var(--bar1);opacity:.22}.bars .b.b2{background:var(--bar1);top:4px;bottom:4px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);width:min(760px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog:has(.tw){width:min(920px,96vw)}
/* Rollen (Supabase): nur lesen bzw. ausgeblendete Bearbeitung */
#main.ro input:not([data-q]):not([data-qcheck]):not([data-benq]):not([data-ben]),#main.ro select:not([data-act]):not([data-qs]):not([data-ben]),#main.ro textarea,
#main.r-trainer [data-f=ok],#main.r-trainer [data-f=manuell],#main.r-trainer [data-f=korrektur],
#main.r-sportchef [data-beleg],#main.r-sportchef [data-set]{pointer-events:none;opacity:.75;border-color:transparent;background:transparent}
#main.ro [data-act=zuEdit],#main.ro [data-act=teamEdit],#main.ro [data-act=teamDetail],#main.ro [data-act=fktEdit],#main.ro [data-act=saisonNeu],#main.ro [data-act=saisonEdit],
#main.r-trainer [data-act=pauschOk],#main.r-trainer [data-act=csvPersonen],#main.r-trainer .stamm,#main.r-trainer [data-act=personEdit]:not([data-id]){display:none!important}

dialog::backdrop{background:rgba(10,14,22,.45)}
dialog header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
dialog header h3{margin:0;font-size:16px}
dialog .body{padding:16px 18px;max-height:70vh;overflow:auto}
dialog footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.w2{grid-column:span 2}.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--text);font-size:14px}
.form .calc{grid-column:1/-1;background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.notice{padding:10px 14px;border-radius:10px;background:var(--warnSoft);color:var(--warn);margin-bottom:14px}
.notice.ok{background:var(--okSoft);color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
.tabs a.on{border-color:var(--accent);color:var(--text);font-weight:600}
.kattabs{flex-wrap:wrap}.kattabs a{white-space:nowrap}.kattabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--panel2);color:var(--muted);font-size:11px;text-align:center}.kattabs a.on .cnt{background:var(--accentSoft);color:var(--accent)}
.katkpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 14px}.katkpi div{background:var(--panel2);border-radius:10px;padding:8px 12px}.katkpi small{display:block;color:var(--muted);font-size:11px}.katkpi b{font-size:16px}
.minibar{display:inline-block;width:60px;height:6px;border-radius:3px;background:var(--panel2);vertical-align:middle;overflow:hidden;margin-right:6px}.minibar i{display:block;height:100%;background:var(--accent)}

.empty{padding:30px;text-align:center;color:var(--muted)}
details.team{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
details.team>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:18px minmax(200px,1.6fr) repeat(6,minmax(90px,1fr));gap:10px;align-items:center;padding:10px 14px}
details.team>summary::-webkit-details-marker{display:none}
details.team>summary:hover{background:var(--panel2);border-radius:10px}
details.team .chev{transition:transform .15s;color:var(--muted)}details.team[open] .chev{transform:rotate(90deg)}
details.team .tn{font-weight:600}
details.team .tk{text-align:right;font-variant-numeric:tabular-nums}details.team .tk small{display:block;font-size:11px;color:var(--muted)}
details.team .tbody{padding:4px 14px 14px;border-top:1px solid var(--line)}
details.team .tgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:16px;margin-top:10px}
details.team .tgrid>div{min-width:0}
details.team .bpos td:first-child{white-space:normal}
details.team tr.grp td{font-weight:600;background:var(--panel2)}
details.stamm>summary{cursor:pointer}
.kat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
@media (max-width:1200px){details.team>summary{grid-template-columns:18px 1fr repeat(3,auto)}details.team .tk:nth-of-type(n+5){display:none}details.team .tgrid{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;right:18px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:.95}
#printArea{display:none}
@media (max-width:800px){#app{grid-template-columns:1fr}nav{position:static;height:auto}main{padding:16px}}

/* ---------- Beleg ---------- */
.beleg{background:#fff;color:#111;width:210mm;min-height:290mm;padding:18mm 18mm 14mm;margin:0 auto 20px;font-size:10.5pt;position:relative}
.beleg .bh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #c8102e;padding-bottom:10px}
.beleg .club{font-size:16pt;font-weight:800;color:#c8102e}
.beleg .club small{display:block;font-size:9pt;color:#444;font-weight:400}
.beleg .meta{text-align:right;font-size:9pt;color:#333}
.beleg .addr{margin:16mm 0 10mm;min-height:28mm;font-size:11pt}
.beleg h2{font-size:14pt;margin:0 0 4px}
.beleg .sub{color:#555;margin-bottom:12px}
.beleg table{width:100%;border-collapse:collapse;margin:8px 0 14px}
.beleg th{background:#f1f1f1;color:#333;font-size:9pt;position:static;text-align:left;padding:5px 6px;border-bottom:1px solid #bbb}
.beleg td{padding:5px 6px;border-bottom:1px solid #ddd;white-space:normal}
.beleg .tot td{border:none;padding:3px 6px}
.beleg .tot .net td{font-weight:800;font-size:12pt;border-top:2px solid #111;padding-top:6px}
.beleg .pay{margin-top:10px;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:10pt}
.beleg .sig{display:grid;grid-template-columns:1fr 1fr;gap:20mm;margin-top:22mm}
.beleg .sig div{border-top:1px solid #333;padding-top:4px;font-size:9pt;color:#444}
.beleg .foot{position:absolute;bottom:10mm;left:18mm;right:18mm;font-size:8pt;color:#777;border-top:1px solid #ddd;padding-top:4px}
.printlist{background:#fff;color:#111;padding:12mm;font-size:9pt}
.printlist table th{position:static;background:#eee;color:#111}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #app,#toast,dialog{display:none!important}
  #printArea{display:block}
  .beleg{margin:0;page-break-after:always;box-shadow:none}
  .printlist{page-break-after:always}
}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm"><header><h3 id="dlgTitle"></h3><button class="btn ghost" value="cancel" formnovalidate>✕</button></header><div class="body" id="dlgBody"></div><footer id="dlgFoot"></footer></form></dialog>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="fileIn" accept=".js,.json" hidden>
<input type="file" id="csvIn" accept=".xlsx,.csv,.txt" multiple hidden>
<input type="file" id="dirIn" webkitdirectory hidden>
<script>
"use strict";
/* =====================================================================
   FCF Budget & Löhne – lokale App
   Daten: CSV-Dateien im Ordner daten/ des Git-Repos fcf-budget
   ===================================================================== */
const LS_UI = 'fcf_budget_ui_v1';
let D = null;            // Daten
let dirty = false;       // Änderungen seit letztem Datei-Speichern
let noData = false;      // keine Daten gefunden
let ui = {view:'dashboard', saison:null, hj:'H1', sort:{}, q:{}, stamm:'personen', stat:'teams'};
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI)||'{}')); } catch(e){}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined || v === '') return 0; const n = Number(String(v).replace(/['’\s]/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const isSet = v => v !== null && v !== undefined && v !== '';
const r05 = v => Math.round(v * 20) / 20;
const chf = (v, d = 2) => (Number(v) || 0).toLocaleString('de-CH', {minimumFractionDigits:d, maximumFractionDigits:d});
const chf0 = v => chf(v, 0);
const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '–';
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => (s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
const HJ = {H1:'1. Halbjahr (Vorrunde)', H2:'2. Halbjahr (Rückrunde)'};
const HJk = {H1:'1. HJ', H2:'2. HJ'};
const ART = {einheiten:'pro Einheit (NDS)', pauschal:'Pauschal', einsatz:'pro Einsatz'};
const ARTtag = {einheiten:'ein', pauschal:'pau', einsatz:'eins'};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- Index ---------- */
let idx = {p:{}, t:{}, f:{}};
function reindex(){
  idx = {p:{}, t:{}, f:{}};
  D.personen.forEach(p => idx.p[p.id] = p);
  D.teams.forEach(t => idx.t[t.id] = t);
  D.funktionen.forEach(f => idx.f[f.id] = f);
}
const S = () => D.saisons.find(s => s.id === ui.saison) || D.saisons[D.saisons.length - 1];
const pname = p => p ? `${p.vorname} ${p.nachname}`.trim() : '– offen –';
const pnameRev = p => p ? `${p.nachname} ${p.vorname}`.trim() : '– offen –';
const tname = id => idx.t[id]?.name || id || '–';
const fname = id => idx.f[id]?.name || id || '–';

/* ---------- Berechnung ---------- */
const art = z => idx.f[z.funktionId]?.abrechnung || 'pauschal';
const ansatz = z => (num(z.grund) + num(z.js) + num(z.treue)) * (num(z.faktor) || 1);
const ansatzE = z => num(z.ansatzEinsatz) || num(idx.f[z.funktionId]?.ansatzEinsatz);
function bonusE(z, n){ const f = idx.f[z.funktionId]; return f && num(f.bonusAb) > 0 && n >= num(f.bonusAb) ? num(f.bonus) : 0; }
function budgetCalc(z){
  switch (art(z)) {
    case 'einheiten': return num(z.einheitenBudget) * ansatz(z);
    case 'einsatz': { const n = num(z.budgetEinsaetze); return n * ansatzE(z) + bonusE(z, n); }
    default: return num(z.pauschaleH1) + num(z.pauschaleH2);
  }
}
const budget = z => isSet(z.budgetManuell) ? num(z.budgetManuell) : budgetCalc(z);
const erf = (s, hj, zid) => (s.erfassung[hj] || {})[zid];
function istCalc(z, hj, e){
  switch (art(z)) {
    case 'einheiten': return num(e.einheiten) * ansatz(z);
    case 'einsatz': { const n = num(e.einsaetze); return n * ansatzE(z) + bonusE(z, n); }
    default: return e.ok ? num(z['pauschale' + hj]) : 0;
  }
}
function ist(s, z, hj){
  const e = erf(s, hj, z.id); if (!e) return 0;
  return (isSet(e.manuell) ? num(e.manuell) : istCalc(z, hj, e)) + num(e.korrektur);
}
const istJahr = (s, z) => ist(s, z, 'H1') + ist(s, z, 'H2');
const spesenAnteil = z => num(idx.f[z.funktionId]?.spesenanteil);
function detailText(z, hj, e){
  if (!e) return '';
  let t;
  if (isSet(e.manuell)) t = 'Betrag manuell';
  else switch (art(z)) {
    case 'einheiten': t = `${num(e.einheiten)} Einheiten × CHF ${chf(ansatz(z))}`; break;
    case 'einsatz': { const n = num(e.einsaetze), b = bonusE(z, n); t = `${n} Einsätze × CHF ${chf(ansatzE(z))}` + (b ? ` + Pauschale CHF ${chf0(b)}` : ''); break; }
    default: t = 'Pauschale ' + HJk[hj];
  }
  if (num(e.korrektur)) t += `, Korrektur ${num(e.korrektur) > 0 ? '+' : ''}${chf(e.korrektur)}`;
  if (e.bemerkung) t += ` (${e.bemerkung})`;
  return t;
}
function jahresLohn(s, pid){
  return s.zuordnungen.filter(z => z.personId === pid)
    .reduce((a, z) => a + Math.max(budget(z), istJahr(s, z)) * (1 - spesenAnteil(z) / 100), 0);
}
function ahvPflichtig(s, pid){
  const p = idx.p[pid]; const m = p?.ahvPflicht || 'auto';
  if (m === 'ja') return true; if (m === 'nein') return false;
  return jahresLohn(s, pid) > num(D.einstellungen.ahvFreigrenze);
}
function abrechnung(s, pid, hj){
  const pos = [];
  s.zuordnungen.filter(z => z.personId === pid).forEach(z => {
    const e = erf(s, hj, z.id); const b = ist(s, z, hj);
    if (!e || !b) return;
    const sp = r05(b * spesenAnteil(z) / 100);
    pos.push({z, betrag: b, spesen: sp, detail: detailText(z, hj, e)});
  });
  const brutto = pos.reduce((a, x) => a + x.betrag, 0);
  const spesen = pos.reduce((a, x) => a + x.spesen, 0);
  const lohn = brutto - spesen;
  const pflicht = ahvPflichtig(s, pid);
  const E = D.einstellungen;
  const basis = E.ahvBasis === 'lohn' ? lohn : brutto;

async function sbSave(changes, deletedSaisons){
  for (const [path, text] of Object.entries(changes)) {
    const file = path.split('/').pop(), sid = (path.match(/^daten\/saisons\/([^/]+)\//) || [])[1];
    if (file === 'einstellungen.json') { await sbUpsert('einstellungen', [{id: 1, data: JSON.parse(text)}], ['id']); continue; }
    if (file === 'saison.json') { const m = JSON.parse(text); await sbUpsert('saisons', [{id: sid, name: m.name, status: m.status, notiz: m.notiz || ''}], ['id']); continue; }
    const [table, keys] = SB_TABLES[file] || []; if (!table) continue;
    const name = table === 'personen' ? 'personen' : table;
    const withS = r => sid ? {...r, saisonId: sid} : r;
    const ordered = ['teams', 'funktionen', 'budgetpositionen'].includes(table);
    const withP = (r, i) => ordered ? {...r, pos: i} : r;
    const oldRows = fromCSV(name, lastText[path] || '').map(withS).map(withP), newRows = fromCSV(name, text).map(withS).map(withP);
    const cols = SCHEMA[name].cols.concat(sid ? ['saisonId'] : [], ordered ? ['pos'] : []);
    const oldM = new Map(oldRows.map(r => [sbKey(r, keys), r]));
    const newM = new Map(newRows.map(r => [sbKey(r, keys), r]));
    if (table === 'personen') {
      const base = [], priv = [];
      newM.forEach((r, k) => {
        const o = oldM.get(k);
        const b = sbClean('personen', r, SB_BASE), p = sbClean('personen', r, ['id', ...SB_PRIVAT]);
        if (!o || JSON.stringify(b) !== JSON.stringify(sbClean('personen', o, SB_BASE))) base.push(b);
        if (o ? JSON.stringify(p) !== JSON.stringify(sbClean('personen', o, ['id', ...SB_PRIVAT])) : SB_PRIVAT.some(c => r[c])) priv.push(p);
      });
      await sbUpsert('personen', base, ['id']); await sbUpsert('personen_privat', priv, ['id']);
    } else {
      const up = []; newM.forEach((r, k) => { const o = oldM.get(k); const c = sbClean(name, r, cols); if (!o || JSON.stringify(c) !== JSON.stringify(sbClean(name, o, cols))) up.push(c); });
      await sbUpsert(table, up, keys);
    }
    for (const [k, r] of oldM) if (!newM.has(k)) await sbDelete(table, keys, r);
  }

const GH_DEFAULT = {repo: 'rggyh95wwz-netizen/fcf-budget', branch: 'main'};
const GH_KEY = 'fcf_budget_gh_v1';
function ghCfg(){ try { return JSON.parse(localStorage.getItem(GH_KEY) || sessionStorage.getItem(GH_KEY) || 'null'); } catch(e){ return null; } }
async function gh(path, opt = {}){
  const base = src.proxy ? '/api/repo' : `https://api.github.com/repos/${src.repo}`;
  const r = await fetch(`${base}${path ? "/" + path : ""}`, {...opt, headers: {...(src.proxy ? {} : {Authorization: `Bearer ${src.token}`}), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opt.body ? {'Content-Type': 'application/json'} : {})}});
  if (!r.ok) { const e = new Error((await r.json().catch(() => ({}))).message || r.statusText); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
const b64utf8 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
async function ghTree(sha){ const t = await gh(`git/trees/${sha}?recursive=1`); const m = {}; t.tree.filter(x => x.type === 'blob').forEach(x => m[x.path] = x.sha); return m; }
async function ghLoad(){
  src.head = (await gh(`git/ref/heads/${src.branch}`)).object.sha;
  src.tree = await ghTree(src.head); src.cache = {};
  const paths = Object.keys(src.tree).filter(p => p.startsWith('daten/'));
  await Promise.all(paths.map(async p => { src.cache[p] = b64utf8((await gh(`git/blobs/${src.tree[p]}`)).content); }));
}
async function ghLogin(form){

    const u = await fetch('https://api.github.com/user', {headers: {Authorization: `Bearer ${token}`}}).then(r => r.ok ? r.json() : {});
    s.user = u.login || ''; src = prev;
    const cfg = JSON.stringify({token, repo, user: s.user});
    try { localStorage.removeItem(GH_KEY); sessionStorage.removeItem(GH_KEY); (form.merken ? localStorage : sessionStorage).setItem(GH_KEY, cfg); } catch(e){}
    await openSource(s);
  } catch(e){ src = null; toast(e.status === 401 ? 'Zugangsschlüssel ungültig' : e.status === 404 ? `Kein Zugriff auf ${repo}. Schlüssel braucht Zugriff auf dieses Repo.` : 'Anmeldung fehlgeschlagen: ' + e.message); render(); }
}
function ghLogout(){ if (src?.proxy) { location.href = '/cdn-cgi/access/logout'; return; } try { localStorage.removeItem(GH_KEY); sessionStorage.removeItem(GH_KEY); } catch(e){} src = null; D = emptyData(); migrate(); render(); }
async function ghSave(changes, deletes){
  for (let attempt = 0; attempt < 3; attempt++) {
    const head = (await gh(`git/ref/heads/${src.branch}`)).object.sha;
    let remoteMoved = false;
    if (head !== src.head) {
      const remote = await ghTree(head);
      const clash = Object.keys(changes).find(p => remote[p] !== src.tree[p]);
      if (clash) { conflict = clash; return false; }
      remoteMoved = true; src.head = head;
      Object.entries(remote).forEach(([p, sha]) => { if (!(p in changes)) src.tree[p] = sha; });
    }
    const base = await gh(`git/commits/${head}`);
    const entries = Object.entries(changes).map(([path, content]) => ({path, mode: '100644', type: 'blob', content}))
      .concat(deletes.map(path => ({path, mode: '100644', type: 'blob', sha: null})));
    const tree = await gh('git/trees', {method: 'POST', body: JSON.stringify({base_tree: base.tree.sha, tree: entries})});
    const files = Object.keys(changes).concat(deletes).map(p => p.replace(/^daten\//, '')).join(', ');
    const commit = await gh('git/commits', {method: 'POST', body: JSON.stringify({message: `App: ${files.length > 120 ? Object.keys(changes).length + ' Dateien' : files} geändert${src.user ? ' (' + src.user + ')' : ''}`, tree: tree.sha, parents: [head]})});
    try { await gh(`git/refs/heads/${src.branch}`, {method: 'PATCH', body: JSON.stringify({sha: commit.sha})}); }
    catch(e){ if (e.status === 422) continue; throw e; }
    src.head = commit.sha; src.tree = await ghTree(commit.sha);
    if (remoteMoved) toast('Änderungen von Kolleg/innen wurden zusammengeführt');
    return true;
  }
  throw new Error('Repo wurde gleichzeitig geändert, bitte neu laden');
}
async function ghCheckRemote(){
  if (src?.kind !== 'gh' || dirty || saving || conflict) return;
  try { const head = (await gh(`git/ref/heads/${src.branch}`)).object.sha; if (head !== src.head) { await openSource(src, true); toast('Neue Änderungen geladen'); } } catch(e){}
}
async function fsFile(path, create){
  const parts = path.split('/'); const name = parts.pop();
  const d = await getSub(src.root, parts, create); return d.getFileHandle(name, {create});
}
async function readText(path){
  if (src.kind === 'gh' || src.kind === 'sb') return src.cache[path] ?? null;
  if (src.kind === 'files') { const f = src.files[path]; if (!f) return null; lastMod[path] = f.lastModified; return f.text(); }
  try { const f = await (await fsFile(path, false)).getFile(); lastMod[path] = f.lastModified; return await f.text(); } catch(e){ return null; }
}
async function listSaisons(){
  if (src.kind === 'sb') return src.saisonIds;
  if (src.kind === 'gh') return [...new Set(Object.keys(src.tree).map(p => (p.match(/^daten\/saisons\/([^/]+)\//) || [])[1]).filter(Boolean))].sort();
  if (src.kind === 'files') return [...new Set(Object.keys(src.files).map(p => (p.match(/^daten\/saisons\/([^/]+)\//) || [])[1]).filter(Boolean))].sort();
  try { const d = await getSub(src.root, ['daten', 'saisons'], false); const out = []; for await (const [n, h] of d.entries()) if (h.kind === 'directory') out.push(n); return out.sort(); } catch(e){ return []; }
}

async function saveAll(force){
  if (!src || readOnly() || saving) return;
  saving = true;
  try {
    const files = serialize();
    if (src.kind === 'sb') {
      const changes = {}; Object.entries(files).forEach(([p, t]) => { if (lastText[p] !== t) changes[p] = t; });
      const ids = new Set(D.saisons.map(s => s.id)), delS = src.saisonIds.filter(id => !ids.has(id));
      if (!Object.keys(changes).length && !delS.length) { dirty = false; return; }
      try { await sbSave(changes, delS); }
      catch(e){ dirty = false; saving = false; toast('Nicht gespeichert: ' + e.message); await openSource(src, true); return; }
      Object.assign(lastText, changes); src.saisonIds = [...ids].sort(); dirty = false;
      if (Object.entries(serialize()).some(([p, t]) => lastText[p] !== t)) setTimeout(() => saveAll(), 100);
      return;
    }
    if (src.kind === 'gh') {
      const changes = {}; Object.entries(files).forEach(([p, t]) => { if (lastText[p] !== t) changes[p] = t; });
      const ids = new Set(D.saisons.map(s => s.id));
      const deletes = Object.keys(src.tree).filter(p => { const m = p.match(/^daten\/saisons\/([^/]+)\//); return m && !ids.has(m[1]); });
      if (!Object.keys(changes).length && !deletes.length) { dirty = false; return; }
      if (force) { src.head = (await gh(`git/ref/heads/${src.branch}`)).object.sha; src.tree = await ghTree(src.head); }
      if (!(await ghSave(changes, deletes))) { render(); return; }
      Object.assign(lastText, changes); deletes.forEach(p => delete lastText[p]);
      conflict = null; dirty = false;
      if (Object.keys(serialize()).some(p => serialize()[p] !== lastText[p])) setTimeout(() => saveAll(), 100);
      return;
    }
    for (const [path, text] of Object.entries(files)) {
      if (lastText[path] === text) continue;
      const fh = await fsFile(path, true);
      if (!force) { const cur = await fh.getFile(); if (lastMod[path] && cur.lastModified > lastMod[path] && (await cur.text()) !== lastText[path]) { conflict = path; render(); return; } }
      const w = await fh.createWritable(); await w.write(text); await w.close();
      lastText[path] = text; lastMod[path] = (await fh.getFile()).lastModified;
    }
    // gelöschte Saisons entfernen
    const ids = new Set(D.saisons.map(s => s.id));
    try { const d = await getSub(src.root, ['daten', 'saisons'], false); for (const id of await listSaisons()) if (!ids.has(id)) { await d.removeEntry(id, {recursive: true}); Object.keys(lastText).filter(p => p.startsWith(`daten/saisons/${id}/`)).forEach(p => delete lastText[p]); } } catch(e){}
    conflict = null; dirty = false;
  } catch(e){ toast('Speichern fehlgeschlagen: ' + e.message); }
  finally { saving = false; renderNav(); }
}

const idb = (mode, fn) => new Promise((res, rej) => {

async function openSource(s, quiet){
  const prev = src; src = s;
  if (s.kind === 'gh') { try { await ghLoad(); } catch(e){ src = prev; toast('Laden fehlgeschlagen: ' + e.message); render(); return; } }
  if (s.kind === 'sb') { try { await sbLoad(); } catch(e){ src = null; if (!e.noAccess && /jwt|token|refresh|angemeldet/i.test(e.message)) { sbSess = null; try { localStorage.removeItem(SB_SESS_KEY); } catch(x){} } toast(e.noAccess ? e.message : 'Laden fehlgeschlagen: ' + e.message); render(); return; } }
  const d = await readAll();
  if (!d) {
    if (s.kind === 'fs' && confirm(`Im Ordner "${s.root.name}" gibt es noch keine Daten (daten/stammdaten/personen.csv). Neue, leere Datenstruktur anlegen?`)) {
      D = emptyData(); migrate(); noData = false; await saveAll(true); render(); return;
    }
    src = prev; toast(s.kind === 'gh' ? `Im Repo ${s.repo} gibt es keinen Ordner daten/.` : 'Keine Daten gefunden. Bitte den Repo-Ordner "fcf-budget" wählen.'); render(); return;
  }
  D = d; noData = false; conflict = null; dirty = false; migrate();
  if (s.kind === 'sb' && istTrainer() && !TRAINER_VIEWS.includes(ui.view)) ui.view = 'teams';
  if (s.kind === 'fs') { try { await idb('readwrite', st => st.put(s.root, 'dir')); } catch(e){} }
  if (!quiet) toast(s.kind === 'sb' ? `Angemeldet als ${src.user} (${ROLLEN[src.rolle]})` : `${D.personen.length} Personen, ${D.saisons.length} Saisons geladen${readOnly() ? ' (nur lesen)' : ''}`);
  render();
}

/* ---------- Tabellen ---------- */
function table(id, cols, rows, opt = {}){
  const st = ui.sort[id] || opt.sort || {};
  if (st.key) {
    const c = cols.find(c => c.key === st.key);
    if (c) {
      const val = c.sv || c.v || (r => r[c.key]);
      rows = [...rows].sort((a, b) => { const x = val(a), y = val(b); const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'de', {numeric: true}); return st.dir === 'desc' ? -r : r; });
    }
  }
  const head = cols.map(c => `<th class="${c.n ? 'n' : ''} ${c.ns ? 'ns' : ''}" ${c.ns ? '' : `data-act="sort" data-t="${id}" data-k="${c.key}"`}>${esc(c.label)}${st.key === c.key ? (st.dir === 'desc' ? ' ▼' : ' ▲') : ''}</th>`).join('');
  const body = rows.map(r => `<tr ${opt.rowAttr ? opt.rowAttr(r) : ''}>` + cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.h ? c.h(r) : esc(c.v ? c.v(r) : r[c.key])}</td>`).join('') + '</tr>').join('');
  const foot = opt.foot ? `<tfoot><tr>${cols.map(c => `<td class="${c.n ? 'n' : ''}">${opt.foot[c.key] ?? ''}</td>`).join('')}</tr></tfoot>` : '';
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">Keine Einträge</td></tr>`}</tbody>${foot}</table></div>`;
}
const searchBox = (id, ph = 'Suchen …') => `<input type="search" placeholder="${ph}" data-q="${id}" value="${esc(ui.q[id] || '')}" style="min-width:220px">`;
const match = (id, ...vals) => { const q = (ui.q[id] || '').toLowerCase().trim(); return !q || vals.join(' ').toLowerCase().includes(q); };
function bars(items, legend){
  const max = Math.max(1, ...items.map(i => Math.max(i.a, i.b || 0)));
  return (legend ? `<div class="legend"><span><i style="background:var(--bar1);opacity:.22"></i>${legend[0]}</span><span><i style="background:var(--bar1)"></i>${legend[1]}</span></div>` : '') +
    `<div class="bars">` + items.map(i => `<div class="row"><div class="lbl" title="${esc(i.l)}">${esc(i.l)}</div><div class="track"><div class="b b1" style="width:${i.a / max * 100}%"></div>${i.b !== undefined ? `<div class="b b2" style="width:${i.b / max * 100}%"></div>` : ''}</div><div class="val">${i.t ?? chf0(i.a)}</div></div>`).join('') + `</div>`;
}

function saveBox(){
  if (!src) return `<span class="dot dirty"></span>Nicht angemeldet`;
  if (src.kind === 'sb') return `<span class="dot ${dirty || saving ? 'dirty' : ''}"></span>${saving ? 'Speichere …' : dirty ? 'Ungespeicherte Änderung …' : 'Gespeichert'}<br><span class="muted">${esc(src.user || '')} · ${ROLLEN[src.rolle] || ''}</span>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="reloadData">Neu laden</button><button class="btn sm" data-act="sbLogout">Abmelden</button></div>`;
  if (src.kind === 'gh') return `<span class="dot ${dirty || conflict || saving ? 'dirty' : ''}"></span>${conflict ? 'Konflikt, nicht gespeichert' : saving ? 'Speichere auf GitHub …' : dirty ? 'Ungespeicherte Änderung …' : readOnly() ? 'Nur lesen' : 'Gespeichert auf GitHub'}<br><span class="muted">${esc(src.user || '')} · ${esc(src.repo.split('/')[1])}</span>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="reloadData">Neu laden</button><button class="btn sm" data-act="ghLogout">Abmelden</button></div>`;
  if (readOnly()) return `<span class="dot dirty"></span>Nur lesen (${esc(src.name || 'Ordner')})<div style="margin-top:8px"><button class="btn sm" data-act="connect">Anderen Ordner</button></div>`;
  return `<span class="dot ${dirty || conflict ? 'dirty' : ''}"></span>${conflict ? 'Konflikt, nicht gespeichert' : dirty ? 'Speichere …' : 'Gespeichert in CSV'}<br><span class="muted">Ordner: ${esc(src.root.name)}</span>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="reloadData" title="Nach git pull die Daten neu einlesen">Neu laden</button></div>
    <div class="hint" style="margin-top:6px">Commit &amp; Push mit GitHub Desktop</div>`;
}
function saisonSel(withHj){
  return `<div class="sel"><select data-act="saison">${D.saisons.map(s => `<option value="${s.id}" ${s.id === S().id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>` +
    (withHj ? `<select data-act="hj">${Object.entries(HJ).map(([k, v]) => `<option value="${k}" ${ui.hj === k ? 'selected' : ''}>${v}</option>`).join('')}</select>` : '') + `</div>`;
}
const pageTop = (title, withSaison = true, withHj = false, extra = '') => `<div class="top"><h1>${title}</h1><div class="sel">${extra}${withSaison ? saisonSel(withHj) : ''}</div></div>`;

/* ---------- Views ---------- */
const V = {};

V.dashboard = () => {
  const s = S(); const zs = s.zuordnungen;
  const bud = zs.reduce((a, z) => a + budget(z), 0);
  const i1 = zs.reduce((a, z) => a + ist(s, z, 'H1'), 0), i2 = zs.reduce((a, z) => a + ist(s, z, 'H2'), 0);
  const personen = new Set(zs.filter(z => z.personId).map(z => z.personId));
  const offen = zs.filter(z => !z.personId);
  const teams = D.teams.filter(t => s.teamBudget[t.id]);
  const aufw = teams.reduce((a, t) => a + teamAufwand(s, t.id), 0), ertr = teams.reduce((a, t) => a + teamErtrag(s, t.id), 0);
  const betr = teams.reduce((a, t) => a + teamBudgetSum(s, t.id, 'Betreuung'), 0);
  const ohneIban = [...personen].map(id => idx.p[id]).filter(p => p && !p.iban);
  const bel = hj => { const l = personenMitBetrag(s, hj); return {n: l.length, aus: l.filter(x => s.belege[hj]?.[x.p.id]?.status === 'ausbezahlt').length, netto: l.reduce((a, x) => a + x.a.netto, 0)}; };
  const b1 = bel('H1'), b2 = bel('H2');
  const byBereich = {};
  zs.forEach(z => { const b = idx.f[z.funktionId]?.bereich || 'Andere'; byBereich[b] ||= {a: 0, b: 0}; byBereich[b].a += budget(z); byBereich[b].b += istJahr(s, z); });
  return pageTop('Dashboard') +
    (s.notiz ? `<div class="notice ok">${esc(s.notiz)}</div>` : '') +
    `<div class="kpis">
      <div class="kpi"><div class="l">Budget Personal (Personen)</div><div class="v">${chf0(bud)}</div><div class="s">${zs.length} Zuordnungen, ${personen.size} Personen</div></div>
      <div class="kpi"><div class="l">Ist 1. Halbjahr</div><div class="v">${chf0(i1)}</div><div class="s">${pct(i1, bud)} vom Jahresbudget</div></div>
      <div class="kpi"><div class="l">Ist 2. Halbjahr</div><div class="v">${chf0(i2)}</div><div class="s">${pct(i2, bud)} vom Jahresbudget</div></div>
      <div class="kpi"><div class="l">Restbudget</div><div class="v ${bud - i1 - i2 < 0 ? 'neg' : ''}">${chf0(bud - i1 - i2)}</div><div class="s">Budget minus Ist</div></div>
      <div class="kpi"><div class="l">Teambudget Aufwand</div><div class="v">${chf0(aufw)}</div><div class="s">davon Betreuung ${chf0(betr)}</div></div>
      <div class="kpi"><div class="l">Teambudget Ertrag / DB</div><div class="v">${chf0(ertr)}</div><div class="s ${ertr - aufw < 0 ? 'neg' : 'pos'}">DB ${chf0(ertr - aufw)}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h2>Budget vs. Ist nach Bereich <small>CHF</small></h2>${bars(Object.entries(byBereich).sort((a, b) => b[1].a - a[1].a).map(([k, v]) => ({l: k, a: v.a, b: v.b, t: `${chf0(v.b)} / ${chf0(v.a)}`})), ['Budget', 'Ist (1.+2. HJ)'])}</div>
      <div class="card"><h2>Offene Punkte</h2>
        <table><tbody>
        <tr><td>Belege 1. HJ</td><td class="n">${b1.aus} von ${b1.n} ausbezahlt</td><td class="n">netto ${chf0(b1.netto)}</td><td><a class="btn sm" data-act="go" data-v="auszahlung" data-hj="H1">öffnen</a></td></tr>
        <tr><td>Belege 2. HJ</td><td class="n">${b2.aus} von ${b2.n} ausbezahlt</td><td class="n">netto ${chf0(b2.netto)}</td><td><a class="btn sm" data-act="go" data-v="auszahlung" data-hj="H2">öffnen</a></td></tr>
        <tr><td>Funktionen ohne Person</td><td class="n">${offen.length}</td><td></td><td><a class="btn sm" data-act="go" data-v="personenbudget">öffnen</a></td></tr>
        <tr><td>Personen ohne IBAN</td><td class="n">${src?.kind === 'sb' && !istAdmin() ? '–' : ohneIban.length}</td><td></td><td><a class="btn sm" data-act="go" data-v="personen">öffnen</a></td></tr>
        </tbody></table>
        ${offen.length ? `<p class="hint" style="margin-top:10px">Offen: ${offen.slice(0, 8).map(z => esc(`${tname(z.teamId)} – ${z.rolle || fname(z.funktionId)}`)).join(', ')}${offen.length > 8 ? ' …' : ''}</p>` : ''}
      </div>
    </div>
    <div class="card"><h2>Personalbudget pro Team <small>Teambudget Betreuung vs. Personenbudget vs. Ist</small></h2>${teamCompareTable(s)}</div>`;
};

function teamCompareRows(s){
  return D.teams.filter(t => s.teamBudget[t.id] || s.zuordnungen.some(z => z.teamId === t.id)).map(t => {
    const zs = s.zuordnungen.filter(z => z.teamId === t.id);
    const pb = zs.reduce((a, z) => a + budget(z), 0);
    const i1 = zs.reduce((a, z) => a + ist(s, z, 'H1'), 0), i2 = zs.reduce((a, z) => a + ist(s, z, 'H2'), 0);
    return {t, tb: teamBudgetSum(s, t.id, 'Betreuung'), pb, i1, i2, n: zs.length};
  });
}
function teamCompareTable(s, kat){
  const rows = teamCompareRows(s).filter(r => !kat || (r.t.kategorie || 'Ohne Kategorie') === kat);
  const sum = k => chf0(rows.reduce((a, r) => a + r[k], 0));
  return table('teamcmp', [
    {key: 'team', label: 'Team', v: r => r.t.name, h: r => `<a data-act="teamDetail" data-id="${r.t.id}" style="cursor:pointer">${esc(r.t.name)}</a>`},
    {key: 'kat', label: 'Kategorie', v: r => r.t.kategorie},
    {key: 'n', label: 'Personen', n: 1, v: r => r.n},
    {key: 'tb', label: 'Teambudget Betreuung', n: 1, v: r => r.tb, h: r => r.tb ? chf0(r.tb) : '<span class="muted">–</span>'},
    {key: 'pb', label: 'Budget Personen', n: 1, v: r => r.pb, h: r => chf0(r.pb)},
    {key: 'diff', label: 'Differenz', n: 1, v: r => r.tb - r.pb, h: r => r.tb ? `<span class="${r.tb - r.pb < 0 ? 'neg' : ''}">${chf0(r.tb - r.pb)}</span>` : '<span class="muted">–</span>'},
    {key: 'i1', label: 'Ist 1. HJ', n: 1, v: r => r.i1, h: r => chf0(r.i1)},
    {key: 'i2', label: 'Ist 2. HJ', n: 1, v: r => r.i2, h: r => chf0(r.i2)},
    {key: 'aus', label: 'Ausschöpfung', n: 1, v: r => r.pb ? (r.i1 + r.i2) / r.pb : 0, h: r => pct(r.i1 + r.i2, r.pb)},
  ], rows, {foot: {team: 'Total', tb: sum('tb'), pb: sum('pb'), i1: sum('i1'), i2: sum('i2'), diff: chf0(rows.reduce((a, r) => a + r.tb - r.pb, 0))}});
}

V.teambudget = () => {
  const s = S();
  const groups = [...new Set(D.budgetPositionen.map(p => p.gruppe))];
  const teams = D.teams.filter(t => t.aktiv !== false || s.teamBudget[t.id]);
  const mk = t => { const r = {t}; groups.forEach(g => r[g] = teamBudgetSum(s, t.id, g)); r.aufw = teamAufwand(s, t.id); r.ertr = teamErtrag(s, t.id); r.db = r.ertr - r.aufw; r.sp = num((s.teamEckdaten[t.id] || {}).spieler); return r; };
  const all = teams.map(mk);
  const katOf = r => r.t.kategorie || 'Ohne Kategorie';
  const kats = [...new Set(all.map(katOf))];
  const agg = rs => { const o = {n: rs.length, sp: 0, aufw: 0, ertr: 0, db: 0}; rs.forEach(r => { o.sp += r.sp; o.aufw += r.aufw; o.ertr += r.ertr; o.db += r.db; groups.forEach(g => o[g] = (o[g] || 0) + r[g]); }); return o; };
  const tot = agg(all);
  let kat = ui.tbKat || ''; if (kat && !kats.includes(kat)) kat = '';
  const tabs = `<div class="tabs kattabs"><a data-act="tbKat" data-v="" class="${!kat ? 'on' : ''}">Übersicht</a>` +
    kats.map(k => `<a data-act="tbKat" data-v="${esc(k)}" class="${kat === k ? 'on' : ''}">${esc(k)} <span class="cnt">${all.filter(r => katOf(r) === k).length}</span></a>`).join('') + `</div>`;
  const dbH = v => `<span class="${v < 0 ? 'neg' : 'pos'}">${chf0(v)}</span>`;
  let body;
  if (!kat) {
    const kr = kats.map(k => ({k, ...agg(all.filter(r => katOf(r) === k))}));
    body = table('tbkat', [
      {key: 'k', label: 'Kategorie', v: r => r.k, h: r => `<a data-act="tbKat" data-v="${esc(r.k)}" style="cursor:pointer"><b>${esc(r.k)}</b></a>`},
      {key: 'n', label: 'Teams', n: 1, v: r => r.n}, {key: 'sp', label: 'Spieler/innen', n: 1, v: r => r.sp},
      {key: 'aufw', label: 'Aufwand', n: 1, v: r => r.aufw, h: r => chf0(r.aufw)}, {key: 'ertr', label: 'Ertrag', n: 1, v: r => r.ertr, h: r => chf0(r.ertr)},
      {key: 'db', label: 'DB (Ertrag − Aufwand)', n: 1, v: r => r.db, h: r => dbH(r.db)},
      {key: 'kps', label: 'Kosten / Spieler', n: 1, v: r => r.sp ? r.aufw / r.sp : 0, h: r => r.sp ? chf0(r.aufw / r.sp) : '–'},
      {key: 'ant', label: 'Anteil Aufwand', n: 1, v: r => r.aufw, h: r => `<span class="minibar"><i style="width:${Math.round(100 * r.aufw / (tot.aufw || 1))}%"></i></span> ${pct(r.aufw, tot.aufw)}`},
    ], kr, {foot: {k: 'Total', n: tot.n, sp: tot.sp, aufw: chf0(tot.aufw), ertr: chf0(tot.ertr), db: chf0(tot.db), kps: tot.sp ? chf0(tot.aufw / tot.sp) : ''}});
  } else {
    const rows = all.filter(r => katOf(r) === kat), a = agg(rows);
    const kpi = `<div class="katkpi"><div><small>Teams</small><b>${a.n}</b></div><div><small>Spieler/innen</small><b>${a.sp}</b></div><div><small>Aufwand</small><b>${chf0(a.aufw)}</b></div><div><small>Ertrag</small><b>${chf0(a.ertr)}</b></div><div><small>DB</small><b class="${a.db < 0 ? 'neg' : 'pos'}">${chf0(a.db)}</b></div><div><small>Kosten / Spieler</small><b>${a.sp ? chf0(a.aufw / a.sp) : '–'}</b></div><div><small>Anteil Aufwand</small><b>${pct(a.aufw, tot.aufw)}</b></div></div>`;
    const cols = [{key: 'team', label: 'Team', v: r => r.t.name, h: r => `<a data-act="teamDetail" data-id="${r.t.id}" style="cursor:pointer">${esc(r.t.name)}</a>`},
      {key: 'sp', label: 'Spieler/innen', n: 1, v: r => r.sp}]
      .concat(groups.map(g => ({key: g, label: g, n: 1, v: r => r[g], h: r => chf0(r[g])})))
      .concat([{key: 'aufw', label: 'Aufwand total', n: 1, v: r => r.aufw, h: r => `<b>${chf0(r.aufw)}</b>`},
        {key: 'db', label: 'DB (Ertrag − Aufwand)', n: 1, v: r => r.db, h: r => dbH(r.db)},
        {key: 'kps', label: 'Kosten / Spieler', n: 1, v: r => r.sp ? r.aufw / r.sp : 0, h: r => r.sp ? chf0(r.aufw / r.sp) : '–'},
        {key: 'x', label: '', ns: 1, h: r => `<button class="btn sm" data-act="teamDetail" data-id="${r.t.id}">bearbeiten</button>`}]);
    const foot = {team: 'Total ' + kat, sp: a.sp}; groups.concat(['aufw', 'db']).forEach(g => foot[g] = chf0(a[g]));
    body = kpi + table('teamb', cols, rows, {foot});
  }
  return pageTop('Budget Teams') +
    `<div class="card"><h2>Teambudget ${esc(s.name)} <small>${kat ? 'Klick auf ein Team für Positionen und Eckdaten' : 'Klick auf eine Kategorie für ihre Teams'}</small></h2>
     <div class="toolbar"><span class="hint">Einnahmen = J+S, Sponsoring, Mitgliederbeiträge. Gruppen und Positionen wie im Excel "Budget Sport".</span><span class="sp"></span><button class="btn" data-act="csvTeams">CSV exportieren</button></div>
     ${tabs}${body}</div>
     <div class="card"><h2>Personalbudget pro Team${kat ? ' <small>' + esc(kat) + '</small>' : ''}</h2>${teamCompareTable(s, kat)}</div>`;
};

      {key: 'treue', label: 'Treue', n: 1, v: r => art(r.z) === 'einheiten' ? num(r.z.treue) : ''},

      {key: 'ist', label: 'Ist (1.+2. HJ)', n: 1, v: r => istJahr(s, r.z), h: r => chf0(istJahr(s, r.z))},

      {key: 'budgetHj', label: 'Budget Einh./HJ', n: 1, v: r => art(r.z) === 'einheiten' ? num(r.z.einheitenBudget) / 2 : '', h: r => art(r.z) === 'einheiten' ? `<span class="muted">${num(r.z.einheitenBudget) / 2}</span>` : ''},

V.statistik = () => {
  const s = S(); const tabs = {teams: 'Teams', bereiche: 'Bereiche', personen: 'Personen', trainer: 'Trainer-Kennzahlen', saisons: 'Saisonvergleich'};
  let body = '';
  if (ui.stat === 'teams') {
    const rows = teamCompareRows(s).sort((a, b) => b.pb - a.pb);
    body = `<div class="card"><h2>Personalbudget vs. Ist pro Team</h2>${bars(rows.map(r => ({l: r.t.name, a: r.pb, b: r.i1 + r.i2, t: `${chf0(r.i1 + r.i2)} / ${chf0(r.pb)}`})), ['Budget Personen', 'Ist'])}</div>
      <div class="card"><h2>Teambudget Aufwand pro Team</h2>${bars(D.teams.filter(t => s.teamBudget[t.id]).map(t => ({l: t.name, a: teamAufwand(s, t.id), b: teamBudgetSum(s, t.id, 'Betreuung'), t: chf0(teamAufwand(s, t.id))})).sort((a, b) => b.a - a.a), ['Aufwand total', 'davon Betreuung'])}</div>`;
  } else if (ui.stat === 'bereiche') {
    const g = {}; s.zuordnungen.forEach(z => { const f = idx.f[z.funktionId]; const k = f?.bereich || 'Andere'; g[k] ||= {n: 0, b: 0, i1: 0, i2: 0, p: new Set()}; g[k].n++; g[k].b += budget(z); g[k].i1 += ist(s, z, 'H1'); g[k].i2 += ist(s, z, 'H2'); if (z.personId) g[k].p.add(z.personId); });
    const a = {}; s.zuordnungen.forEach(z => { const k = ART[art(z)]; a[k] ||= {b: 0, i: 0}; a[k].b += budget(z); a[k].i += istJahr(s, z); });
    const rows = Object.entries(g).map(([k, v]) => ({k, ...v, pn: v.p.size}));
    body = `<div class="card"><h2>Nach Bereich</h2>${table('stb', [{key: 'k', label: 'Bereich'}, {key: 'n', label: 'Zuordnungen', n: 1}, {key: 'pn', label: 'Personen', n: 1},
        {key: 'b', label: 'Budget', n: 1, h: r => chf0(r.b)}, {key: 'i1', label: 'Ist 1. HJ', n: 1, h: r => chf0(r.i1)}, {key: 'i2', label: 'Ist 2. HJ', n: 1, h: r => chf0(r.i2)},
        {key: 'q', label: 'Ausschöpfung', n: 1, v: r => r.b ? (r.i1 + r.i2) / r.b : 0, h: r => pct(r.i1 + r.i2, r.b)}], rows, {sort: {key: 'b', dir: 'desc'}})}</div>
      <div class="card"><h2>Nach Abrechnungsart</h2>${bars(Object.entries(a).map(([k, v]) => ({l: k, a: v.b, b: v.i, t: `${chf0(v.i)} / ${chf0(v.b)}`})), ['Budget', 'Ist'])}</div>`;
  } else if (ui.stat === 'personen') {
    const ids = [...new Set(s.zuordnungen.filter(z => z.personId).map(z => z.personId))];
    const rows = ids.map(id => { const zs = s.zuordnungen.filter(z => z.personId === id); return {p: idx.p[id], n: zs.length, teams: [...new Set(zs.map(z => idx.t[z.teamId]?.id))].join(', '), b: zs.reduce((a, z) => a + budget(z), 0), i1: zs.reduce((a, z) => a + ist(s, z, 'H1'), 0), i2: zs.reduce((a, z) => a + ist(s, z, 'H2'), 0), ahv: ahvPflichtig(s, id)}; }).filter(r => r.p);
    body = `<div class="card"><h2>Top 15 Jahresbudget pro Person</h2>${bars(rows.sort((a, b) => b.b - a.b).slice(0, 15).map(r => ({l: pname(r.p), a: r.b, b: r.i1 + r.i2, t: chf0(r.b)})), ['Budget', 'Ist'])}</div>
      <div class="card"><h2>Alle Personen</h2>${table('stp', [{key: 'p', label: 'Person', v: r => pnameRev(r.p)}, {key: 'teams', label: 'Teams'}, {key: 'n', label: 'Funktionen', n: 1},
        {key: 'b', label: 'Budget', n: 1, h: r => chf0(r.b)}, {key: 'i1', label: 'Ist 1. HJ', n: 1, h: r => chf0(r.i1)}, {key: 'i2', label: 'Ist 2. HJ', n: 1, h: r => chf0(r.i2)},
        {key: 'ahv', label: 'AHV-pflichtig', v: r => r.ahv ? 'ja' : 'nein'}], rows, {sort: {key: 'b', dir: 'desc'}})}</div>`;
  } else if (ui.stat === 'trainer') {
    const tz = s.zuordnungen.filter(z => art(z) === 'einheiten');
    const js = tz.filter(z => num(z.js) >= 10).length;
    const einhB = tz.reduce((a, z) => a + num(z.einheitenBudget), 0);
    const einh = hj => tz.reduce((a, z) => a + num(erf(s, hj, z.id)?.einheiten), 0);
    const avgA = tz.length ? tz.reduce((a, z) => a + ansatz(z), 0) / tz.length : 0;
    const dist = (k, vals) => vals.map(v => ({l: `${k} ${v}`, a: tz.filter(z => num(z[k === 'Treue' ? 'treue' : k === 'J+S' ? 'js' : 'faktor']) === v).length})).map(x => ({...x, t: x.a + ' Zuordnungen'}));
    const uniq = k => [...new Set(tz.map(z => num(z[k])))].sort((a, b) => a - b);
    body = `<div class="kpis">
        <div class="kpi"><div class="l">Trainer-Zuordnungen</div><div class="v">${tz.length}</div></div>
        <div class="kpi"><div class="l">J+S-Quote (gültig)</div><div class="v">${pct(js, tz.length)}</div><div class="s">${js} von ${tz.length}</div></div>
        <div class="kpi"><div class="l">Ø Ansatz pro Einheit</div><div class="v">${chf(avgA)}</div></div>
        <div class="kpi"><div class="l">Einheiten Budget / Jahr</div><div class="v">${chf0(einhB)}</div></div>
        <div class="kpi"><div class="l">Einheiten erfasst 1. HJ</div><div class="v">${chf0(einh('H1'))}</div><div class="s">${pct(einh('H1'), einhB / 2)} vom HJ-Budget</div></div>
        <div class="kpi"><div class="l">Einheiten erfasst 2. HJ</div><div class="v">${chf0(einh('H2'))}</div><div class="s">${pct(einh('H2'), einhB / 2)} vom HJ-Budget</div></div></div>
      <div class="grid2"><div class="card"><h2>Verteilung J+S-Beitrag</h2>${bars(dist('J+S', uniq('js')))}</div>
      <div class="card"><h2>Verteilung Vereinstreue</h2>${bars(dist('Treue', uniq('treue')))}</div>
      <div class="card"><h2>Verteilung Faktor</h2>${bars(dist('Faktor', uniq('faktor')))}</div>
      <div class="card"><h2>Einheiten Budget vs. erfasst pro Team</h2>${bars(D.teams.map(t => { const z = tz.filter(z => z.teamId === t.id); return {l: t.name, a: z.reduce((a, z) => a + num(z.einheitenBudget), 0), b: z.reduce((a, z) => a + num(erf(s, 'H1', z.id)?.einheiten) + num(erf(s, 'H2', z.id)?.einheiten), 0)}; }).filter(x => x.a).map(x => ({...x, t: `${x.b} / ${x.a}`})), ['Budget', 'erfasst'])}</div></div>`;
  } else {
    const rows = D.saisons.map(x => { const zs = x.zuordnungen; return {s: x, n: zs.length, p: new Set(zs.map(z => z.personId).filter(Boolean)).size, b: zs.reduce((a, z) => a + budget(z), 0), i1: zs.reduce((a, z) => a + ist(x, z, 'H1'), 0), i2: zs.reduce((a, z) => a + ist(x, z, 'H2'), 0), tb: D.teams.reduce((a, t) => a + teamAufwand(x, t.id), 0)}; });
    body = `<div class="card"><h2>Saisons im Vergleich</h2>${table('sts', [{key: 'n0', label: 'Saison', v: r => r.s.name}, {key: 'st', label: 'Status', v: r => r.s.status}, {key: 'n', label: 'Zuordnungen', n: 1}, {key: 'p', label: 'Personen', n: 1},
      {key: 'tb', label: 'Teambudget Aufwand', n: 1, h: r => chf0(r.tb)}, {key: 'b', label: 'Budget Personen', n: 1, h: r => chf0(r.b)}, {key: 'i1', label: 'Ist 1. HJ', n: 1, h: r => chf0(r.i1)}, {key: 'i2', label: 'Ist 2. HJ', n: 1, h: r => chf0(r.i2)}], rows)}</div>
      <div class="card"><h2>Budget Personen pro Saison</h2>${bars(rows.map(r => ({l: r.s.name, a: r.b, b: r.i1 + r.i2, t: chf0(r.b)})), ['Budget', 'Ist'])}</div>`;
  }
  return pageTop('Statistiken') + `<div class="tabs">${Object.entries(tabs).map(([k, v]) => `<a data-act="stat" data-v="${k}" class="${ui.stat === k ? 'on' : ''}">${v}</a>`).join('')}</div>` + body;
};

      {key: 'budget', label: 'Budget Saison', n: 1, v: r => r.zs.reduce((a, z) => a + budget(z), 0), h: r => chf0(r.zs.reduce((a, z) => a + budget(z), 0))},

V.teams = () => {
  const s = S();
  const groups = [...new Set(D.budgetPositionen.map(p => p.gruppe))];
  ui.open ||= {};
  const showInactive = !!ui.q.teInaktiv;
  const q = (ui.q.tov || '').toLowerCase().trim();
  const trainer = src?.kind === 'sb' && istTrainer();
  const besetzung = trainer ? (src.besetzung || []).filter(b => b.saisonId === s.id && b.personId !== src.personId) : [];
  const meine = new Set([...s.zuordnungen.map(z => z.teamId), ...besetzung.map(b => b.teamId)]);
  const teams = D.teams.filter(t => trainer ? meine.has(t.id) : (showInactive || t.aktiv !== false || s.zuordnungen.some(z => z.teamId === t.id) || s.teamBudget[t.id]));
  const kats = [...new Set(teams.map(t => t.kategorie || 'Ohne Kategorie'))];
  let sumTb = 0, sumPb = 0, sumIst = 0, sumN = 0;
  const block = t => {
    const zs = s.zuordnungen.filter(z => z.teamId === t.id).sort((a, b) => (fname(a.funktionId) + pnameRev(idx.p[a.personId])).localeCompare(fname(b.funktionId) + pnameRev(idx.p[b.personId]), 'de'));
    const hit = !q || t.name.toLowerCase().includes(q) || t.id.toLowerCase().includes(q) || zs.some(z => pname(idx.p[z.personId]).toLowerCase().includes(q));
    if (!hit) return '';
    const tb = s.teamBudget[t.id] || {}, ek = s.teamEckdaten[t.id] || {};
    const aufw = teamAufwand(s, t.id), betr = teamBudgetSum(s, t.id, 'Betreuung');
    const pb = zs.reduce((a, z) => a + budget(z), 0), i1 = zs.reduce((a, z) => a + ist(s, z, 'H1'), 0), i2 = zs.reduce((a, z) => a + ist(s, z, 'H2'), 0);
    sumTb += aufw; sumPb += pb; sumIst += i1 + i2; sumN += zs.length;
    const open = q ? true : !!ui.open[t.id];
    const menge = z => art(z) === 'einheiten' ? `${num(z.einheitenBudget)} Einh. × ${chf(ansatz(z))}` : art(z) === 'einsatz' ? `${num(z.budgetEinsaetze)} Eins. × ${chf(ansatzE(z))}` : `${chf0(z.pauschaleH1)} + ${chf0(z.pauschaleH2)}`;
    const posRows = groups.map(g => {
      const ps = D.budgetPositionen.filter(p => p.gruppe === g && num(tb[p.id]));
      if (!ps.length) return '';
      const sum = ps.reduce((a, p) => a + num(tb[p.id]), 0);
      return `<tr class="grp"><td>${esc(g)}</td><td class="n">${chf0(sum)}</td></tr>` + ps.map(p => `<tr><td style="padding-left:22px">${esc(p.name)}</td><td class="n">${chf0(tb[p.id])}</td></tr>`).join('');
    }).join('');
    const eck = [['spieler', 'Spieler/innen'], ['einheiten', 'Einheiten/Jahr'], ['staff', 'Staff'], ['trainingsProWoche', 'Trainings/Woche'], ['meisterschaft', 'Meisterschaftsspiele']].filter(([k]) => isSet(ek[k])).map(([k, l]) => `${l}: <b>${num(ek[k])}</b>`).join(' · ');
    return `<details class="team" data-team="${t.id}" ${open ? 'open' : ''}>
      <summary><span class="chev">▸</span><span class="tn">${esc(t.name)} <span class="muted" style="font-weight:400">${esc(t.id)}</span>${t.aktiv === false ? ' <span class="tag">inaktiv</span>' : ''}</span>
        <span class="tk"><small>Personen</small>${zs.length + besetzung.filter(b => b.teamId === t.id).length}</span>
        <span class="tk"><small>Teambudget</small>${chf0(aufw)}</span>
        <span class="tk"><small>Betreuung</small>${chf0(betr)}</span>
        <span class="tk"><small>Budget Personen</small>${chf0(pb)}</span>
        <span class="tk"><small>Ist 1.+2. HJ</small>${chf0(i1 + i2)}</span>
        <span class="tk"><small>Diff. Betreuung</small><span class="${betr && betr - pb < 0 ? 'neg' : ''}">${betr ? chf0(betr - pb) : '–'}</span></span></summary>
      <div class="tbody">
        ${eck ? `<p class="hint" style="margin:0 0 10px">${eck}</p>` : ''}
        <div class="tgrid">
          <div><div class="toolbar" style="margin-bottom:6px"><b>Personen</b><span class="sp"></span><button class="btn sm" data-act="zuEdit" data-team="${t.id}">+ Person zuordnen</button></div>
            <div class="tw" style="max-height:none"><table><thead><tr><th class="ns">Person</th><th class="ns">Funktion</th><th class="ns">Abrechnung</th><th class="ns n">Menge × Ansatz</th><th class="ns n">Budget</th><th class="ns n">Ist 1. HJ</th><th class="ns n">Ist 2. HJ</th><th class="ns"></th></tr></thead><tbody>
            ${besetzung.filter(b => b.teamId === t.id).map(b => `<tr><td>${esc(`${b.nachname || ''} ${b.vorname || ''}`.trim() || 'offen')}</td><td>${esc(b.rolle || b.funktion || '')}</td><td colspan="6" class="muted">Beträge nur für Leitung sichtbar</td></tr>`).join('')}
            ${zs.map(z => `<tr><td>${z.personId ? `<a data-act="personDetail" data-id="${z.personId}" style="cursor:pointer">${esc(pnameRev(idx.p[z.personId]))}</a>` : '<span class="tag red">offen</span>'}</td><td>${esc(z.rolle || fname(z.funktionId))}</td><td><span class="tag ${ARTtag[art(z)]}">${ART[art(z)]}</span></td><td class="n muted">${menge(z)}</td><td class="n"><b>${chf0(budget(z))}</b></td><td class="n">${chf0(ist(s, z, 'H1'))}</td><td class="n">${chf0(ist(s, z, 'H2'))}</td><td><button class="btn sm" data-act="zuEdit" data-id="${z.id}">bearbeiten</button></td></tr>`).join('') || '<tr><td colspan="8" class="empty">Noch keine Personen</td></tr>'}

const fi = (k, l, v, type = 'text') => `<label>${esc(l)}<input type="${type}" ${type === 'number' ? 'step="any"' : ''} data-set="${k}" value="${esc(v ?? '')}"></label>`;

/* ---------- Detail-Dialoge ---------- */
function dialog(title, body, buttons, onSubmit){
  $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = body;
  $('#dlgFoot').innerHTML = buttons || `<button class="btn" value="cancel" formnovalidate>Abbrechen</button><button class="btn pri" value="ok">Speichern</button>`;
  const dlg = $('#dlg');
  dlg.onclose = () => { if (dlg.returnValue && dlg.returnValue !== 'cancel' && onSubmit) onSubmit(dlg.returnValue, formData()); };
  dlg.returnValue = ''; dlg.showModal();
}
function formData(){ const o = {}; $('#dlgBody').querySelectorAll('[name]').forEach(el => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; }); return o; }
const ff = (name, label, val, type = 'text', cls = '') => `<label class="${cls}">${esc(label)}<input name="${name}" type="${type}" ${type === 'number' ? 'step="any"' : ''} value="${esc(val ?? '')}"></label>`;
const fs = (name, label, val, opts, cls = '') => `<label class="${cls}">${esc(label)}<select name="${name}">${opts.map(o => Array.isArray(o) ? o : [o, o]).map(([k, l]) => `<option value="${esc(k)}" ${String(val) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;

function personEdit(id){
  const p = id ? idx.p[id] : {id: uid('p'), anrede: '', vorname: '', nachname: '', adresse: '', plz: '', ort: '', email: '', telefon: '', iban: '', ahvNr: '', ahvPflicht: 'auto', eintritt: '', notiz: '', aktiv: true};
  dialog(id ? 'Person bearbeiten' : 'Neue Person', `<div class="form">
    ${fs('anrede', 'Anrede', p.anrede, ['', 'Herr', 'Frau'])}${ff('vorname', 'Vorname', p.vorname)}${ff('nachname', 'Nachname', p.nachname)}
    ${ff('adresse', 'Adresse', p.adresse, 'text', 'w2')}${ff('plz', 'PLZ', p.plz)}${ff('ort', 'Ort', p.ort)}${ff('email', 'E-Mail', p.email)}${ff('telefon', 'Telefon', p.telefon)}
    ${ff('iban', 'IBAN', p.iban, 'text', 'w2')}${ff('ahvNr', 'AHV-Nr.', p.ahvNr)}
    ${fs('ahvPflicht', 'AHV-Abzug', p.ahvPflicht || 'auto', [['auto', 'automatisch (Freigrenze)'], ['ja', 'immer abziehen'], ['nein', 'nie abziehen']])}
    ${ff('eintritt', 'Im Verein seit (Jahr)', p.eintritt, 'number')}
    <label>Status<select name="aktiv"><option value="1">aktiv</option><option value="" ${p.aktiv === false ? 'selected' : ''}>inaktiv</option></select></label>
    <label class="full">Notiz<textarea name="notiz">${esc(p.notiz)}</textarea></label></div>`,
    (id ? `<button class="btn" value="del" formnovalidate style="margin-right:auto">Löschen</button>` : '') + `<button class="btn" value="cancel" formnovalidate>Abbrechen</button><button class="btn pri" value="ok">Speichern</button>`,
    (rv, f) => {
      if (rv === 'del') {
        const used = D.saisons.some(s => s.zuordnungen.some(z => z.personId === p.id));
        if (used && !confirm(`${pname(p)} hat Zuordnungen. Person trotzdem löschen? Die Zuordnungen werden auf "offen" gesetzt.`)) return;
        D.saisons.forEach(s => s.zuordnungen.forEach(z => { if (z.personId === p.id) z.personId = null; }));
        D.personen = D.personen.filter(x => x.id !== p.id);
      } else {
        Object.assign(p, f, {aktiv: !!f.aktiv});
        if (!id) D.personen.push(p);
      }
      reindex(); persist(); render();
    });
  if (src?.kind === 'sb') {
    const body = $('#dlgBody');
    if (istTrainer()) { body.querySelectorAll('[name]').forEach(el => { if (!SB_PRIVAT.includes(el.name)) el.disabled = true; }); $('#dlgFoot [value=del]')?.remove(); body.insertAdjacentHTML('afterbegin', '<p class="hint full">Du kannst deine Adresse, Kontaktdaten und IBAN anpassen. Für andere Änderungen bitte beim Admin melden.</p>'); }
    else if (!istAdmin()) { SB_PRIVAT.forEach(n => body.querySelector(`[name=${n}]`)?.closest('label')?.remove()); }
  }
}

      {key: 'b', label: 'Budget', n: 1, v: r => budget(r.z), h: r => chf0(budget(r.z))}, {key: 'i', label: 'Ist', n: 1, v: r => istJahr(r.s, r.z), h: r => chf0(istJahr(r.s, r.z))}], hist)}
    <h4>Auszahlungen</h4>${table('pd2', [{key: 's', label: 'Saison', v: r => r.s.name}, {key: 'hj', label: 'Halbjahr', v: r => HJk[r.hj]}, {key: 'b', label: 'Brutto', n: 1, h: r => chf(r.a.brutto)},
      {key: 'n', label: 'Netto', n: 1, h: r => chf(r.a.netto)}, {key: 'st', label: 'Status', v: r => r.s.belege[r.hj]?.[id]?.status || 'offen'},
      {key: 'x', label: '', ns: 1, h: r => `<button class="btn sm" type="button" data-act="beleg" data-id="${id}" data-s="${r.s.id}" data-hj="${r.hj}">Beleg</button>`}], belege)}`,

function zuEdit(id, preTeam){
  const s = S();
  const z = id ? s.zuordnungen.find(z => z.id === id) : {id: uid('z'), personId: null, teamId: preTeam || D.teams[0]?.id, funktionId: 'TR', rolle: '', trainings: 0, spiele: 0, einheitenBudget: 0, grund: D.einstellungen.ansatzGrund || 10, js: 10, treue: 0, faktor: 1, pauschaleH1: 0, pauschaleH2: 0, ansatzEinsatz: 0, budgetEinsaetze: 0, budgetManuell: null, notiz: ''};

  dialog(id ? 'Zuordnung bearbeiten' : 'Neue Zuordnung', `<div class="form" id="zuForm">
    ${fs('personId', 'Person', z.personId || '', persOpts, 'w2')}${fs('teamId', 'Team', z.teamId, D.teams.map(t => [t.id, t.name]))}
    ${fs('funktionId', 'Funktion', z.funktionId, D.funktionen.map(f => [f.id, `${f.name} (${ART[f.abrechnung]})`]))}${ff('rolle', 'Bezeichnung (z. B. Haupttrainer)', z.rolle)}

    ${ff('trainings', 'Trainings / Jahr', z.trainings, 'number', 'x-einheiten')}${ff('spiele', 'Spiele / Jahr', z.spiele, 'number', 'x-einheiten')}${ff('einheitenBudget', 'Einheiten Budget', z.einheitenBudget, 'number', 'x-einheiten')}
    ${ff('grund', 'Grundbeitrag', z.grund, 'number', 'x-einheiten')}
    <label class="x-einheiten">J+S<input name="js" type="number" step="any" value="${esc(z.js)}" list="jsl"><datalist id="jsl">${D.einstellungen.jsWerte.map(j => `<option value="${j.wert}">${esc(j.label)}</option>`).join('')}</datalist></label>
    <label class="x-einheiten">Vereinstreue<input name="treue" type="number" step="any" value="${esc(z.treue)}"><button type="button" class="btn sm" data-act="treueCalc" style="margin-top:3px">aus Eintrittsjahr</button></label>
    ${ff('faktor', 'Faktor', z.faktor, 'number', 'x-einheiten')}
    ${ff('pauschaleH1', 'Pauschale 1. HJ', z.pauschaleH1, 'number', 'x-pauschal')}${ff('pauschaleH2', 'Pauschale 2. HJ', z.pauschaleH2, 'number', 'x-pauschal')}
    ${ff('ansatzEinsatz', 'Ansatz pro Einsatz (leer = Standard)', z.ansatzEinsatz || '', 'number', 'x-einsatz')}${ff('budgetEinsaetze', 'Einsätze Budget / Jahr', z.budgetEinsaetze, 'number', 'x-einsatz')}
    ${ff('budgetManuell', 'Budget manuell (überschreibt)', z.budgetManuell ?? '', 'number')}
    <label class="full">Notiz<input name="notiz" value="${esc(z.notiz)}"></label>
    <div class="calc" id="zuCalc"></div></div>`,
    (id ? `<button class="btn" value="del" formnovalidate style="margin-right:auto">Löschen</button><button class="btn" value="copy">Als Kopie speichern</button>` : '') + `<button class="btn" value="cancel" formnovalidate>Abbrechen</button><button class="btn pri" value="ok">Speichern</button>`,
    (rv, f) => {
      if (rv === 'del') { if (!confirm('Zuordnung löschen?')) return; s.zuordnungen = s.zuordnungen.filter(x => x.id !== z.id); ['H1', 'H2'].forEach(h => delete s.erfassung[h][z.id]); }
      else {
        const t = rv === 'copy' ? {...z, id: uid('z')} : z;
        applyZu(t, f);
        if (!id || rv === 'copy') s.zuordnungen.push(t);
      }
      persist(); render();
    });
  const upd = () => {
    const f = formData(); const t = applyZu({...z}, f); const a = art(t);
    document.querySelectorAll('#zuForm [class*="x-"]').forEach(el => el.style.display = el.classList.contains('x-' + a) ? '' : 'none');

  form.addEventListener('change', upd);
  upd();
}
function applyZu(z, f){
  ['trainings', 'spiele', 'einheitenBudget', 'grund', 'js', 'treue', 'faktor', 'pauschaleH1', 'pauschaleH2', 'ansatzEinsatz', 'budgetEinsaetze'].forEach(k => z[k] = num(f[k]));
  z.personId = f.personId || null; z.teamId = f.teamId; z.funktionId = f.funktionId; z.rolle = f.rolle; z.notiz = f.notiz;
  z.budgetManuell = isSet(f.budgetManuell) ? num(f.budgetManuell) : null;
  return z;
}
function treueCalc(){
  const form = $('#zuForm'); const p = idx.p[form.querySelector('[name=personId]').value];
  if (!p || !num(p.eintritt)) { toast('Bei der Person ist kein Eintrittsjahr erfasst'); return; }

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = [';', '\t', ','].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}

async function unzip(buf){

  let e = u.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('keine gültige .xlsx-Datei');

    const st = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true), data = u.subarray(st, st + f.cs);
    if (f.m === 0) return new TextDecoder().decode(data);
    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
}

  if (wb && rels) { const first = P(wb).getElementsByTagName('sheet')[0], rid = first?.getAttribute('r:id'); const rel = rid && [...P(rels).getElementsByTagName('Relationship')].find(r => r.getAttribute('Id') === rid); if (rel) sheet = 'xl/' + rel.getAttribute('Target').replace(/^\/?xl\//, ''); }

    const cols = []; dRow.forEach((v, i) => { if (i > 0) { const d = xlDate(v); if (d) { if (d >= von && d <= bis) cols.push(i); else ausser++; } } });
    const li = rows.findIndex(r => /^leiter/i.test(lab(r))); if (li < 0) throw new Error(`${file.name}: Abschnitt "Leiter/-in" nicht gefunden`);

function markdown(s){
  const L = [`---`, `saison: "${s.id}"`, `status: ${s.status}`, `erstellt: ${new Date().toISOString().slice(0, 10)}`, `tags: [fcf, budget]`, `---`, ``, `# Budget & Auszahlungen ${s.name}`, ``, `> Automatisch erzeugt aus der FCF Budget App. Änderungen bitte in der App machen.`, ``];
  const zs = s.zuordnungen, bud = zs.reduce((a, z) => a + budget(z), 0);
  L.push(`## Übersicht`, ``, `| Kennzahl | CHF |`, `|---|---:|`, `| Budget Personen | ${chf0(bud)} |`, `| Ist 1. HJ | ${chf0(zs.reduce((a, z) => a + ist(s, z, 'H1'), 0))} |`, `| Ist 2. HJ | ${chf0(zs.reduce((a, z) => a + ist(s, z, 'H2'), 0))} |`, ``);
  L.push(`## Teams`, ``, `| Team | Teambudget Betreuung | Budget Personen | Ist 1. HJ | Ist 2. HJ |`, `|---|---:|---:|---:|---:|`);
  teamCompareRows(s).forEach(r => L.push(`| ${r.t.name} | ${chf0(r.tb)} | ${chf0(r.pb)} | ${chf0(r.i1)} | ${chf0(r.i2)} |`));
  L.push(``, `## Personen`, ``, `| Person | Team | Funktion | Budget | Ist 1. HJ | Ist 2. HJ |`, `|---|---|---|---:|---:|---:|`);
  [...zs].sort((a, b) => pnameRev(idx.p[a.personId]).localeCompare(pnameRev(idx.p[b.personId]), 'de')).forEach(z => L.push(`| ${pnameRev(idx.p[z.personId])} | ${tname(z.teamId)} | ${z.rolle || fname(z.funktionId)} | ${chf0(budget(z))} | ${chf0(ist(s, z, 'H1'))} | ${chf0(ist(s, z, 'H2'))} |`));
  ['H1', 'H2'].forEach(hj => { const l = personenMitBetrag(s, hj); if (!l.length) return;
    L.push(``, `## Auszahlung ${HJ[hj]}`, ``, `| Beleg | Person | Brutto | AHV | Netto | Status |`, `|---|---|---:|---:|---:|---|`);
    l.forEach(({p, a}) => L.push(`| ${s.id}-${hj}-${p.id} | ${pnameRev(p)} | ${chf(a.brutto)} | ${chf(a.ahv)} | ${chf(a.netto)} | ${s.belege[hj]?.[p.id]?.status || 'offen'} |`)); });
  return L.join('\n') + '\n';
}
